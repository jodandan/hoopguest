name: probe-naver
# 임시: 농심카페 공개 게시판 목록·최근 글 양 조회(읽기만). 조사 끝나면 삭제.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36';
          const H={'User-Agent':UA,'Accept':'application/json','Referer':'https://m.cafe.naver.com/'};
          const cafe=10586238;
          const m=await fetch(`https://apis.naver.com/cafe-web/cafe2/SideMenuList?cafeId=${cafe}`,{headers:H}).then(r=>r.json()).catch(e=>({e:String(e)}));
          const menus=(m?.message?.result?.menus)||[];
          console.log('메뉴 수',menus.length);
          const kw=/게스트|픽업|연습|교류|매칭|팀원|용병|모집|구함|대관|농구/;
          for(const x of menus){
            if(!['B','L','Q','F'].includes(x.menuType)&&!kw.test(x.menuName))continue;
            let n=0,recent=0,sample='';
            try{const r=await fetch(`https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/${cafe}/menus/${x.menuId}/articles?page=1&pageSize=50&sortBy=TIME&viewType=L`,{headers:H}).then(r=>r.json());
              const a=r?.result?.articleList||[];n=a.length;const now=Date.now();
              const items=a.map(i=>i.item||i);recent=items.filter(i=>now-(i.writeDateTimestamp||0)<7*864e5).length;
              sample=items.slice(0,3).map(i=>(i.subject||'').slice(0,30)).join(' / ');}catch(e){sample='읽기 실패';}
            console.log(`${x.menuId}\t${x.menuType}\t${x.menuName}\t최근50중 7일내 ${recent}\t${sample}`);
            await new Promise(r=>setTimeout(r,300));
          }
          JS
          node p.mjs
